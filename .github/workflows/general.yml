name: General workflow

on:
  push:
    # branches:
    #   - '*'
    branches-ignore:
      - deploy

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --force

      - name: Build Project
        run: npm run build
