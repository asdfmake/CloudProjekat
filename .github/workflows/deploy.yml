
name: deploy

on:
  push:
    branches:
      - deploy

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --force

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: 20.77.64.6
          username: azureivan
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd CloudProjekat
            git fetch --all
            git reset --hard origin/deploy
            date +"%Y-%m-%d %H:%M:%S" > latest_fetch