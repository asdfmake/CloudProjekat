
name: deploy

on:
  push:
    branches:
      - deploy

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --force

      - name: Build Project
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: 31.97.184.63
          username: Deployer
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /Deployments/cicd_test
            git fetch --all
            git reset --hard origin/deploy
            docker compose -f ../test-compose.yml up -d --build
            date +"%Y-%m-%d %H:%M:%S" > latest_fetch